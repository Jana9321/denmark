name : sample
on:
  push:
    branches:
      - main
      - "feature/*"
      - "release/**"
      - "!develop"
  workflow_dispatch:
    inputs:
      name:
        description: 'Name of the person to greet'
        required: true
        default: 'World'    
  pull_request:
    branches:
      - main
  issues:
    types: [opened, edited, closed]
permissions:
  contents: read

jobs:
  display:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Display message
        run: |
            Get-Location
            dir
            echo $GITHUB_SHA
            echo $GITHUB_REPOSITORY
            echo $GITHUB_WORKSPACE
            
      
      - name: python code
        shell: python
        run: |
            import platform
            print(platform.system())
            import os
            print(os.getcwd())
            import sys
            print(sys.version)       
            
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Display checkout information
        run: |
            echo $GITHUB_SHA          
            echo $GITHUB_REPOSITORY
            echo $GITHUB_REF
